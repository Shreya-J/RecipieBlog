{% extends "base.html" %}

{% block content %}
    <div class="form-card" style="max-width: 650px; animation: fadeIn 0.4s ease;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 60px; height: 60px; background-color: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                <i data-lucide="chef-hat" style="width: 32px; height: 32px; stroke-width: 1.5;"></i>
            </div>
            <h2 style="margin-bottom: 0.5rem;">Share a Recipe</h2>
            <p style="color: var(--text-muted);">Fill out the details below to add your culinary creation to the gallery.</p>
        </div>
        
        <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 2rem;">

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                {{ form.as_p }}
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap;">
                <button type="submit" class="btn btn-main" style="flex: 2; min-width: 150px;">
                    <i data-lucide="send" style="width: 18px; height: 18px;"></i> Post Recipe
                </button>
                <a href="{% url 'home' %}" class="btn btn-outline" style="flex: 1; min-width: 100px; text-align: center;">
                    Cancel
                </a>
            </div>
        </form>
    </div>
{% endblock %}
